<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1e1b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Palestra">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icona-32.png">
<link rel="apple-touch-icon" href="icona-180.png">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;-webkit-text-size-adjust:100%}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Diario Full Body</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a phone-first gym logbook — sticky header with week/phase, three tabs, stacked exercise cards like a clipboard sheet */
:root{
  --bg:#eef0ec; --surface:#ffffff; --sunk:#e3e6e0; --ink:#1a1e1b; --muted:#5f6760; --line:#d2d6cf;
  --plate:#e0a100; --plate-ink:#7a5600; --plate-soft:#fbf1d2;
  --good:#2f7d4f; --good-soft:#e2f2e7; --warn:#b4471f; --warn-soft:#f8e6de;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141715; --surface:#1d211e; --sunk:#252a26; --ink:#e9ece7; --muted:#9aa39b; --line:#323832;
  --plate:#f0b51e; --plate-ink:#f6c94e; --plate-soft:#3a3018;
  --good:#5cc286; --good-soft:#1d3326; --warn:#f08a62; --warn-soft:#3b231a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --surface:#1d211e; --sunk:#252a26; --ink:#e9ece7; --muted:#9aa39b; --line:#323832;
  --plate:#f0b51e; --plate-ink:#f6c94e; --plate-soft:#3a3018;
  --good:#5cc286; --good-soft:#1d3326; --warn:#f08a62; --warn-soft:#3b231a; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ink);color:var(--bg)}
header.top .wrap{padding-block:12px 0;display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{margin:0;font-family:var(--display);font-weight:800;font-size:30px;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.brand h1 span{color:var(--plate)}
.wk{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.8;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;background:none;border:0;color:inherit;opacity:.65;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;padding:8px 4px 10px;border-bottom:3px solid transparent;cursor:pointer}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--plate)}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--plate);outline-offset:2px}

main{padding-block:16px 120px;display:flex;flex-direction:column;gap:16px}
.note{font-size:13px;color:var(--muted)}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px}

.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select,input[type=date]{width:100%;font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.days button{font-family:var(--display);font-weight:800;font-size:22px;padding:10px 0 8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;cursor:pointer;position:relative}
.days button[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:#1a1e1b}
.days button small{display:block;font-family:var(--body);font-weight:500;font-size:11px;letter-spacing:.02em}

.step{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.step h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.check{display:flex;align-items:flex-start;gap:10px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--good);flex:none;margin:1px 0 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:13px;padding:6px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ex-head{display:grid;grid-template-columns:104px 1fr;gap:12px;align-items:center}
.ex-ttl{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.figbox{background:var(--sunk);border-radius:10px;aspect-ratio:4/3;max-width:100%;display:flex;overflow:hidden}
.figbox svg{width:100%;height:100%;display:block}
.fig .body{fill:none;stroke:var(--ink);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.fig .body circle{fill:var(--ink);stroke:none}
.fig .gear{fill:none;stroke:var(--plate);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fig .gf{fill:var(--plate);stroke:none}
.fig .gnd{stroke:var(--line);stroke-width:2}
.vid{font-size:13px;font-weight:600;color:var(--plate-ink);text-decoration:none;border-bottom:1px solid currentColor}
.vid:focus-visible{outline:2px solid var(--plate);outline-offset:2px}
.ex-head h3{margin:0;font-size:16px;font-weight:600;line-height:1.25;text-wrap:balance}
.target{font-family:var(--mono);font-size:13px;font-weight:600;white-space:nowrap;background:var(--sunk);padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.ex-note{font-size:13px;color:var(--muted)}
.hint{font-size:13px;border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:flex-start}
.hint.up{background:var(--good-soft);color:var(--good)}
.hint.keep{background:var(--sunk);color:var(--muted)}
.hint b{font-weight:600}
.sets{display:grid;grid-template-columns:28px 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sets .n{font-family:var(--mono);font-size:13px;color:var(--muted);text-align:center}
.sets input{width:100%;min-width:0;font-family:var(--mono);font-size:17px;font-weight:600;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-variant-numeric:tabular-nums}
.sets input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.row-btns{display:flex;gap:8px;flex-wrap:wrap}
.ghost{background:none;border:1px dashed var(--line);color:var(--muted);font:inherit;font-size:13px;padding:6px 10px;border-radius:8px;cursor:pointer}
.ghost:hover{color:var(--ink);border-color:var(--muted)}

.savebar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.savebar .wrap{padding-block:10px 0;display:flex;gap:10px;align-items:center}
.savebar .msg{flex:1;min-width:0;font-size:13px;color:var(--muted)}
.primary{background:var(--plate);color:#1a1e1b;border:0;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:.06em;text-transform:uppercase;padding:12px 22px;border-radius:10px;cursor:pointer}
.primary:disabled{opacity:.5;cursor:default}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .v{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.stat .k{font-size:12px;color:var(--muted);margin-top:4px}
.chartbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.chartbox svg{width:100%;height:auto;display:block}
.chart-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.delta{font-family:var(--mono);font-size:13px;font-weight:600}
.delta.pos{color:var(--good)} .delta.neg{color:var(--warn)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}
.hist{display:flex;flex-direction:column;gap:8px}
.hrow{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.hrow .d{font-family:var(--display);font-weight:800;font-size:24px;width:30px;text-align:center}
.hrow .t{min-width:0}
.hrow .t div:first-child{font-weight:600}
.hrow .t div:last-child{font-size:12px;color:var(--muted);font-family:var(--mono)}
.del{background:none;border:1px solid var(--line);color:var(--muted);font:inherit;font-size:12px;padding:5px 9px;border-radius:7px;cursor:pointer}
.del.arm{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
h2.sec{margin:6px 0 0;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}

.prog section{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.prog h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;text-transform:uppercase;letter-spacing:.04em}
.prog ul,.prog ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.prog p{margin:0}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.timer{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.timer .tlbl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.timer .tval{font-family:var(--display);font-weight:800;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;min-width:3.2ch}
.timer.done .tval{color:var(--good)}
.timer.done .tlbl{color:var(--good)}
.tbtn{background:var(--sunk);border:0;color:var(--ink);font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border-radius:8px;cursor:pointer}
.bwform{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}
.bwform input{width:100%;min-width:0;font-family:var(--mono);font-size:17px;font-weight:600;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.bwform input[type=date]{font-family:var(--body);font-size:15px;font-weight:400}
.primary.sm{font-size:16px;padding:10px 16px}
.bwlist{display:flex;flex-direction:column;gap:6px}
.bwrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;border-top:1px solid var(--line);padding-top:6px}
.bwrow b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pday-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pit{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:start;border-top:1px solid var(--line);padding-top:10px}
.figbox.sm{width:64px}
.figbox.xs{width:56px}
.pit-main{min-width:0;display:flex;flex-direction:column;gap:4px}
.pit-n{font-weight:600;line-height:1.25}
.pit-m{font-size:12px;color:var(--muted)}
.pit-ctl{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pit-ctl select,.pit-ctl input{width:auto;font-family:var(--mono);font-size:15px;font-weight:600;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
.pit-ctl input{width:2.8em;text-align:center;padding-inline:4px}
.pit-btns{display:flex;flex-direction:column;gap:4px}
.ib{width:34px;height:30px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;cursor:pointer;font-size:14px;line-height:1}
.ib:disabled{opacity:.3;cursor:default}
.ghost.add{align-self:flex-start;font-weight:600;color:var(--plate-ink);border-color:var(--plate)}
.sheet[hidden]{display:none}
.sheet{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-head{background:var(--ink);color:var(--bg);flex:none}
.sheet-head .wrap{padding-block:12px;display:flex;flex-direction:column;gap:10px}
.sheet-ttl{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-ttl h2{margin:0;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.sheet-close{background:var(--plate);color:#1a1e1b;border:0;font:inherit;font-weight:700;padding:8px 16px;border-radius:8px;cursor:pointer}
.sheet input[type=search]{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:0;background:var(--surface);color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{flex:none;border:1px solid currentColor;background:none;color:inherit;opacity:.7;font:inherit;font-size:13px;padding:5px 11px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plate);border-color:var(--plate);color:#1a1e1b;opacity:1}
.sheet-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sheet-body .wrap{padding-block:12px 40px;display:flex;flex-direction:column;gap:8px}
.lrow{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px 8px 8px;color:var(--ink);font:inherit;cursor:pointer}
.lrow .lplus{font-family:var(--display);font-weight:800;font-size:26px;color:var(--plate-ink);width:28px;text-align:center}
.lrow.in{border-color:var(--good)}
.lrow.in .lplus{color:var(--good)}
.lgrp{font-family:var(--display);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:8px}
.mk{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:12px}
.mk summary{cursor:pointer;font-weight:600}
.mkf{display:grid;gap:8px;margin-top:10px}
.mkf input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:40;transition:opacity .2s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.timer .tlbl{display:none}.days button{font-size:20px}.stat .v{font-size:26px}}
</style>

</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Full Body <span>3×</span></h1>
      <div class="wk" id="wkLabel">Settimana 1 · Fase 1</div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-log" aria-selected="true">Allenamento</button>
      <button role="tab" id="tab-prog" aria-selected="false">Progressi</button>
      <button role="tab" id="tab-plan" aria-selected="false">Scheda</button>
    </nav>
  </div>
</header>

<div class="wrap">
  <main id="view-log"></main>
  <main id="view-prog" hidden></main>
  <main id="view-plan" class="prog" hidden></main>
</div>

<div class="savebar" id="savebar">
  <div class="wrap">
    <div class="msg" id="saveMsg">Inserisci peso e ripetizioni di ogni serie.</div>
    <div class="timer" id="timer" hidden><span class="tlbl" id="tlbl">Recupero</span><span class="tval" id="tval">1:30</span><button class="tbtn" id="tplus">+15 s</button><button class="tbtn" id="tstop">Stop</button></div>
    <button class="primary" id="saveBtn">Salva</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTtl">
  <div class="sheet-head"><div class="wrap">
    <div class="sheet-ttl"><h2 id="sheetTtl">Giorno A</h2><button class="sheet-close" id="sheetClose">Fatto</button></div>
    <input type="search" id="libQ" placeholder="Cerca: panca, curl, leg press…" aria-label="Cerca esercizio" autocomplete="off">
    <div class="chips" id="libG" role="group" aria-label="Muscolo"></div>
    <div class="chips" id="libE" role="group" aria-label="Attrezzo"></div>
  </div></div>
  <div class="sheet-body" id="sheetBody"><div class="wrap" id="libList"></div></div>
</div>

<script>
/* ---------- Programma ---------- */
// inc = incremento consigliato in kg; bw = corpo libero (kg facoltativi); assist = kg di assistenza (meno è meglio)
const X = (id,n,s,r,o={})=>({id,n,s,r,...o});
const PROGRAM = {
 1:{label:"Base",weeks:"1–4",rest:"60–90 s",
  A:[X("leg-press","Leg press",3,[12,15],{inc:5,note:"Piedi larghezza spalle, non bloccare le ginocchia"}),
     X("chest-press","Chest press (macchina)",3,[12,15],{inc:2.5,note:"Scapole indietro"}),
     X("lat-larga","Lat machine presa larga avanti",3,[12,15],{inc:2.5,note:"Barra al petto, mai dietro la nuca"}),
     X("leg-curl","Leg curl",3,[12,15],{inc:2.5,note:"Ritorno lento"}),
     X("shoulder-macchina","Shoulder press (macchina)",3,[12,15],{inc:2.5,note:"Schiena appoggiata"})],
  B:[X("leg-extension","Leg extension",3,[12,15],{inc:2.5,note:"Pausa di 1 s in alto"}),
     X("ponte-glutei","Ponte glutei a terra",3,[15,15],{bw:true,inc:2.5,note:"Spingi con i talloni"}),
     X("pectoral","Pectoral machine (croci)",3,[12,15],{inc:2.5,note:"Gomiti leggermente piegati"}),
     X("pulley-basso","Pulley basso (rematore al cavo)",3,[12,15],{inc:2.5,note:"Petto alto, gomiti vicini"}),
     X("alzate-laterali","Alzate laterali con manubri",3,[12,15],{inc:1,note:"Braccia fino all'altezza delle spalle"}),
     X("curl-manubri","Curl bicipiti con manubri",2,[12,15],{inc:1,note:"Gomiti fermi"})],
  C:[X("squat-panca","Squat a corpo libero su panca",3,[12,15],{bw:true,inc:2.5,note:"Sfiora la panca e risali"}),
     X("chest-inclinata","Chest press inclinata / piegamenti su panca",3,[12,15],{inc:2.5,note:"Corpo in linea retta"}),
     X("lat-stretta","Lat machine presa stretta",3,[12,15],{inc:2.5,note:"Presa neutra"}),
     X("row-machine","Row machine",3,[12,15],{inc:2.5,note:"Petto sul cuscino"}),
     X("pushdown","Push down tricipiti al cavo",2,[12,15],{inc:1,note:"Gomiti ai fianchi"}),
     X("calf","Calf alla macchina o in piedi",2,[15,15],{inc:5,note:"Movimento completo"})]},
 2:{label:"Consolidamento",weeks:"5–8",rest:"90 s",
  A:[X("goblet-squat","Goblet squat con manubrio",3,[10,12],{inc:2,note:"Manubrio al petto, schiena dritta"}),

const S = {sessions:[], weights:[], plan:null, settings:{start:null,phase:"auto"}, ready:false, mode:"local", col:null, uid:null};
function setSessionsFromLocal(){S.sessions=lsGet("fb3-sessions")||[];S.weights=lsGet("fb3-weights")||[];S.plan=lsGet("fb3-plan");S.settings=Object.assign({start:null,phase:"auto"},lsGet("fb3-settings")||{})}

// Si parte sempre dai dati sul telefono. Se fai l'accesso con Google, il modulo
// Firebase (in fondo alla pagina) chiama attachCloud e da lì si legge e si scrive
// sul cloud; ogni aggiornamento dal cloud viene copiato anche sul telefono.
function cloudErr(e){console.warn(e);toast(e&&e.code==="permission-denied"?"Il cloud ha rifiutato il salvataggio: controlla le regole di Firestore":"Salvataggio sul cloud non riuscito")}
function hasLocalData(){return S.sessions.length||S.weights.length||hasPlan()}
async function initStore(){S.ready=true;renderAll(true)}
window.attachCloud=function(col,user){
  window.detachCloud(true);
  S.col=col; S.mode="db"; S.uid=user.uid; S.email=user.email||"";
  const owner=lsGet("fb3-owner"); let first=true;
  S.unsub=col.onSnapshot(snap=>{
    if(first){
      first=false;
      // Primo accesso con un cloud vuoto: ci si portano i dati già sul telefono
      if(!snap.docs.length&&hasLocalData()&&(!owner||owner===user.uid)){
        S.sessions.forEach(x=>{const {_id,...v}=x;col.doc(_id||"s"+x.ts).set(v).catch(cloudErr)});
        S.weights.forEach(x=>{const {_id,...v}=x;col.doc(_id||"w"+x.date).set(v).catch(cloudErr)});
        if(hasPlan()) col.doc("plan").set({days:S.plan.days,custom:S.plan.custom||{}}).catch(cloudErr);
        col.doc("settings").set({start:S.settings.start||null,phase:S.settings.phase||"auto"}).catch(cloudErr);
        toast("Dati del telefono copiati nel cloud");
        return;
      }
    }
    const ses=[], ws=[]; let st=null, pl=null;
    snap.docs.forEach(d=>{const v=d.data();if(!v)return; if(d.id==="settings") st=v; else if(d.id==="plan") pl=v; else if(v.type==="session") ses.push({...v,_id:d.id}); else if(v.type==="weight") ws.push({...v,_id:d.id})});
    S.sessions=ses.sort((a,b)=>a.ts-b.ts);
    S.weights=ws.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
    S.settings=Object.assign({start:null,phase:"auto"},st||{});
    if(!planDirty) S.plan=pl&&Array.isArray(pl.days)?pl:null;
    lsSet("fb3-owner",user.uid); lsSet("fb3-sessions",S.sessions); lsSet("fb3-weights",S.weights); lsSet("fb3-settings",S.settings); lsSet("fb3-plan",S.plan);
    renderAll(false);
  },e=>{cloudErr(e);window.detachCloud()});
  renderAll(false);
};
window.detachCloud=function(quiet){
  if(S.unsub){try{S.unsub()}catch(e){}} S.unsub=null; S.col=null; S.email=null;
  if(S.mode==="db"){S.mode="local";setSessionsFromLocal();if(!quiet)renderAll(false)}
};

/* ---------- Stato derivato ---------- */
function startDate(){return S.settings.start || (S.sessions[0]&&S.sessions[0].date) || today()}
function weekNo(){return Math.max(1,Math.floor(daysBetween(startDate(),today())/7)+1)}
function autoPhase(w){return w<=4?1:w<=8?2:3}
function hasPlan(){return !!(S.plan&&S.plan.days&&S.plan.days.length)}
function curPhase(){if(S.settings.phase==="custom") return hasPlan()?"P":autoPhase(weekNo());return S.settings.phase==="auto"?autoPhase(weekNo()):Number(S.settings.phase)}
function dayLetters(){return UI.phase==="P"?S.plan.days.map(d=>d.l):["A","B","C"]}
function nextDay(){
  const L=dayLetters(), last=[...S.sessions].reverse().find(s=>(s.phase==="P")===(UI.phase==="P"));
  if(!last||!L.includes(last.day)) return L[0];
  return L[(L.indexOf(last.day)+1)%L.length];
}
function libEx(id){
  if(LIBX[id]) return LIBX[id];
  const c=S.plan&&S.plan.custom&&S.plan.custom[id];
  return c?{id,n:c.n,g:c.g,e:c.e,inc:2.5,custom:true}:null;
}
function exList(day){
  if(UI.phase!=="P") return PROGRAM[UI.phase][day]||[];
  const d=S.plan.days.find(x=>x.l===day); if(!d) return [];
  return d.items.map(it=>{const b=libEx(it.id)||{n:it.id,inc:2.5};return {...b,id:it.id,s:it.s,r:[it.lo,it.hi]}});
}
function exMeta(id){const m=NAMES[id];if(m)return m;const c=libEx(id);return c?{n:c.n,assist:!!c.assist,bw:!!c.bw}:null}
function lastFor(exId){for(let i=S.sessions.length-1;i>=0;i--){const e=(S.sessions[i].entries||[]).find(x=>x.id===exId);if(e&&e.sets&&e.sets.length)return {s:S.sessions[i],e}}return null}
function suggestion(ex){
  const L=lastFor(ex.id); if(!L) return null;
  const sets=L.e.sets, kgs=sets.map(s=>s.kg).filter(v=>v!=null);
  const top=kgs.length?Math.max(...kgs):null;
  const allTop=sets.length>=ex.s && sets.every(s=>(s.reps||0)>=ex.r[1]);
  const lastTxt=sets.map(s=>(s.kg!=null?fmtKg(s.kg)+"×":"")+s.reps).join(" · ");
  if(allTop && top!=null){
    const nk=ex.assist?Math.max(0,top-ex.inc):top+ex.inc;
    return {up:true,text:`Ultima volta (${fmtDate(L.s.date)}): ${lastTxt}. Hai chiuso tutte le serie al massimo: <b>prova ${fmtKg(nk)} kg</b> e riparti da ${ex.r[0]} ripetizioni.`,kg:top};
  }
  if(allTop && top==null) return {up:true,text:`Ultima volta: ${lastTxt}. Serie complete: puoi aggiungere un manubrio leggero o qualche ripetizione.`,kg:null};
  return {up:false,text:`Ultima volta (${fmtDate(L.s.date)}): ${lastTxt}. Stesso peso, punta a +1 ripetizione.`,kg:top};
}

function restFor(ex,p){if(p==="P") return ex.r[1]<=8?120:ex.r[1]<=12?90:75;return p===1?75:p===2?90:(ex.s>=4?120:90)}
const fmtSec=t=>Math.floor(t/60)+":"+String(t%60).padStart(2,"0");

/* ---------- Timer di recupero ---------- */
const T={end:0,iv:null,ac:null,wl:null,doneT:null};
function audioPrime(){try{T.ac=T.ac||new (window.AudioContext||window.webkitAudioContext)();T.ac.resume()}catch(e){}}
function beep(){
  try{const ac=T.ac;if(!ac)return;[0,.25,.5].forEach((d,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=i===2?1320:880;o.connect(g);g.connect(ac.destination);const t=ac.currentTime+d;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.4,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.start(t);o.stop(t+.22)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}
}
function timerShow(on){$("#timer").hidden=!on;$("#saveMsg").hidden=on}
function timerTick(){
  const left=Math.ceil((T.end-Date.now())/1000);
  if(left<=0){timerFinish();return}
  $("#tval").textContent=fmtSec(left);
}
function startTimer(sec){
  audioPrime(); clearTimeout(T.doneT); clearInterval(T.iv);
  T.end=Date.now()+sec*1000;
  $("#timer").classList.remove("done"); $("#tlbl").textContent="Recupero"; $("#tplus").hidden=false; $("#tstop").textContent="Stop";
  timerShow(true); timerTick(); T.iv=setInterval(timerTick,250);
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(l=>{T.wl=l}).catch(()=>{})}catch(e){}
}
function timerFinish(){
  clearInterval(T.iv); T.iv=null; beep();
  $("#timer").classList.add("done"); $("#tlbl").textContent="Recupero finito"; $("#tval").textContent="Vai!"; $("#tplus").hidden=true; $("#tstop").textContent="OK";
  T.doneT=setTimeout(stopTimer,8000);
}
function stopTimer(){
  clearInterval(T.iv); clearTimeout(T.doneT); T.iv=null; timerShow(false);
  try{T.wl&&T.wl.release()}catch(e){} T.wl=null;
}
$("#tplus").onclick=()=>{T.end+=15000;timerTick()};
$("#tstop").onclick=stopTimer;

/* ---------- Vista: Progressi ---------- */
function exStats(id){
  const pts=[];
  S.sessions.forEach(s=>{const e=(s.entries||[]).find(x=>x.id===id);if(!e)return;
    const kgs=e.sets.map(x=>x.kg).filter(v=>v!=null);
    const reps=e.sets.reduce((a,x)=>a+(x.reps||0),0);
    const v=kgs.length?(exMeta(id).assist?Math.min(...kgs):Math.max(...kgs)):null;
    pts.push({date:s.date,kg:v,reps,best:e.sets.reduce((a,x)=>Math.max(a,x.reps||0),0)});
  });
  return pts;
}
function chartSVG(pts,assist){
  const useKg=pts.some(p=>p.kg!=null);
  const vals=pts.map(p=>useKg?p.kg:p.reps).map(v=>v==null?null:v);
  const W=340,H=190,L=40,R=16,T=16,B=30;
  const nums=vals.filter(v=>v!=null); let lo=Math.min(...nums), hi=Math.max(...nums);
  if(lo===hi){lo=lo-5;hi=hi+5} const pad=(hi-lo)*0.15; lo=Math.max(0,lo-pad); hi=hi+pad;
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const x=i=>pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo));
  let g="";
  for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmtKg(v)}</text>`}
  const P=pts.map((p,i)=>vals[i]==null?null:[x(i),y(vals[i])]).filter(Boolean);
  const line=P.map((q,i)=>(i?"L":"M")+q[0].toFixed(1)+" "+q[1].toFixed(1)).join(" ");
  const area=P.length>1?line+` L${P[P.length-1][0].toFixed(1)} ${H-B} L${P[0][0].toFixed(1)} ${H-B} Z`:"";
  const last=P[P.length-1], lv=vals.filter(v=>v!=null).slice(-1)[0];
  const lab=(i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="${pts.length===1?"middle":i===0?"start":"end"}" font-size="11" fill="var(--muted)" font-family="IBM Plex Sans,sans-serif">${fmtDate(pts[i].date)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Andamento">
    ${g}
    ${area?`<path d="${area}" fill="var(--plate)" fill-opacity=".14"/>`:""}
    ${P.length>1?`<path d="${line}" fill="none" stroke="var(--plate)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`:""}

function niceStep(r){const p=Math.pow(10,Math.floor(Math.log10(r||1)));const f=r/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function weightHTML(){

function renderProg(){
  const ses=S.sessions; let h="";
  const now=today(); const wkStart=(()=>{const d=new Date(now+"T12:00");const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d.toISOString().slice(0,10)})();
  const thisWeek=ses.filter(s=>s.date>=wkStart).length;
  h+=`<div class="stats">
    <div class="stat"><div class="v">${ses.length}</div><div class="k">allenamenti</div></div>
    <div class="stat"><div class="v">${thisWeek}<span style="font-size:18px;color:var(--muted)">/3</span></div><div class="k">questa settimana</div></div>
    <div class="stat"><div class="v">${weekNo()}</div><div class="k">settimana su 12</div></div>
  </div>`;
  if(!ses.length){
    h+=`<div class="empty"><strong>Nessun allenamento salvato</strong>Registra i pesi nella scheda Allenamento e premi Salva: qui vedrai la curva di ogni esercizio.</div>`+weightHTML();
    $("#view-prog").innerHTML=h;return;
  }
  const ids=[...new Set(ses.flatMap(s=>(s.entries||[]).map(e=>e.id)))].filter(id=>exMeta(id));
  if(!UI.progEx||!ids.includes(UI.progEx)) UI.progEx=ids[0];
  const pts=exStats(UI.progEx), meta=exMeta(UI.progEx);
  const useKg=pts.some(p=>p.kg!=null);
  const first=pts.find(p=>(useKg?p.kg:p.reps)!=null), last=[...pts].reverse().find(p=>(useKg?p.kg:p.reps)!=null);
  let dl=""; if(first&&last&&pts.length>1){
    const a=useKg?first.kg:first.reps,b=useKg?last.kg:last.reps; let diff=b-a; if(meta.assist) diff=-diff;
    const pct=a?Math.round((b-a)/a*100):0;
    dl=`<span class="delta ${diff>0?"pos":diff<0?"neg":""}">${diff>=0?"+":""}${fmtKg(meta.assist?a-b:b-a)}${useKg?" kg":" rip"}${useKg&&!meta.assist&&a?` (${pct>=0?"+":""}${pct}%)`:""} dal ${fmtDate(first.date)}</span>`;
  }
  h+=`<section class="chartbox">
    <div class="field"><label class="lbl" for="exSel">Esercizio</label>
      <select id="exSel">${ids.map(id=>`<option value="${id}"${id===UI.progEx?" selected":""}>${esc(exMeta(id).n)}</option>`).join("")}</select></div>
    <div class="chart-head"><span class="lbl">${meta.assist?"Assistenza minima (kg) · meno è meglio":useKg?"Peso massimo per seduta (kg)":"Ripetizioni totali per seduta"}</span>${dl}</div>
    ${chartSVG(pts,meta.assist)}
  </section>`;
  h+=weightHTML();
  h+=`<h2 class="sec">Storico</h2><div class="hist">`;
  [...ses].reverse().forEach(s=>{
    const nSets=(s.entries||[]).reduce((a,e)=>a+e.sets.length,0);
    const vol=(s.entries||[]).reduce((a,e)=>a+e.sets.reduce((b,x)=>b+(x.kg&&!exMeta(e.id)?.assist?x.kg*(x.reps||0):0),0),0);
    h+=`<div class="hrow"><div class="d">${esc(s.day)}</div>
      <div class="t"><div>${fmtDate(s.date)} · ${s.phase==="P"?"La mia scheda":"Fase "+s.phase}</div><div>${nSets} serie · ${Math.round(vol).toLocaleString("it-IT")} kg sollevati${s.core?" · core ✓":""}</div></div>
      <button class="del${UI.armed===s._id?" arm":""}" data-del="${esc(s._id)}">${UI.armed===s._id?"Conferma":"Elimina"}</button></div>`;
  });
  h+=`</div>`;
  $("#view-prog").innerHTML=h;
}

$("#view-plan").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-pl]"); if(!b) return;
  const a=b.dataset.pl, di=+b.dataset.d, ii=+b.dataset.i;
  if(a!=="delday") UI.armed=null;
  if(a==="new"){S.plan={days:[{l:"A",items:[]}],custom:{}};planChanged();renderPlan();openLib(0);return}
  if(a==="copy"){const p=+b.dataset.p;S.plan={days:["A","B","C"].map(l=>({l,items:PROGRAM[p][l].map(x=>({id:x.id,s:x.s,lo:x.r[0],hi:x.r[1]}))})),custom:{}};planChanged();toast(`Copiata la fase ${p}: ora modificala come vuoi`);renderPlan();return}
  if(a==="add"){openLib(di);return}
  if(a==="addday"){S.plan.days.push({l:LET[S.plan.days.length],items:[]});planChanged();renderPlan();openLib(S.plan.days.length-1);return}
  const d=S.plan.days[di];
  if(a==="up"&&ii>0){[d.items[ii-1],d.items[ii]]=[d.items[ii],d.items[ii-1]]}
  if(a==="down"&&ii<d.items.length-1){[d.items[ii+1],d.items[ii]]=[d.items[ii],d.items[ii+1]]}
  if(a==="rm"){d.items.splice(ii,1)}

    if(UI.armed!=="day"+di){UI.armed="day"+di;renderPlan();return}
    UI.armed=null;S.plan.days.splice(di,1);relabel();

});

});

});
$("#view-prog").addEventListener("change",e=>{if(e.target.id==="exSel"){UI.progEx=e.target.value;renderProg()}});
$("#view-prog").addEventListener("click",async e=>{
  if(e.target.closest("#bwSave")){
    const kg=parseNum($("#bwKg").value), date=$("#bwDate").value||today();
    if(kg==null||kg<30||kg>300){toast("Scrivi il peso in kg, per esempio 82,5");return}
    try{await saveWeight(date,Math.round(kg*10)/10);document.activeElement&&document.activeElement.blur();toast(`Peso del ${fmtDate(date)} salvato`);renderProg()}
    catch(err){toast("Salvataggio non riuscito, riprova tra poco")}
    return;
  }
  const bw=e.target.closest("button[data-delw]");
  if(bw){
    if(UI.armed!==bw.dataset.delw){UI.armed=bw.dataset.delw;renderProg();return}
    UI.armed=null; try{await deleteWeight(bw.dataset.delw);toast("Peso eliminato")}catch(err){toast("Non riesco a eliminarlo, riprova")}
    renderProg(); return;
  }
  const b=e.target.closest("button[data-del]"); if(!b) return;
  if(UI.armed!==b.dataset.del){UI.armed=b.dataset.del;renderProg();return}
  UI.armed=null; try{await deleteSession(b.dataset.del);toast("Allenamento eliminato")}catch(err){toast("Non riesco a eliminarlo, riprova")}
  renderProg();
});

$("#saveBtn").onclick=async()=>{
  const dr=readDraftFromDom(); putDraft(dr);
  const entries=[];
  exList(UI.day).forEach(ex=>{
    const sets=(dr.v[ex.id]||[]).map(s=>({kg:parseNum(s.kg),reps:parseNum(s.reps)})).filter(s=>s.reps>0).map(s=>({kg:s.kg,reps:Math.round(s.reps)}));
    if(sets.length) entries.push({id:ex.id,sets});
  });
  if(!entries.length){toast("Inserisci almeno una serie con le ripetizioni");return}
  const coreDone=UI.phase!=="P"&&CORE[UI.phase][UI.day].every((_,i)=>dr.core[i]);
  const ses={type:"session",date:today(),ts:Date.now(),phase:UI.phase,day:UI.day,warm:!!dr.warm,warmMode:dr.mode,core:coreDone,entries};
  const btn=$("#saveBtn"); btn.disabled=true;
  try{
    if(!S.settings.start&&!S.sessions.length) await saveSettings({start:startDate()});
    await saveSession(ses);
    try{localStorage.removeItem(draftKey())}catch(e){}
    stopTimer(); toast(`Giorno ${UI.day} salvato`);
    UI.day=null; renderAll(true); renderLog(); window.scrollTo(0,0);
  }catch(err){
    toast(err&&err.code==="quota_exceeded"?"Spazio pieno: elimina qualche vecchio allenamento":"Salvataggio non riuscito, riprova tra poco");
  }finally{btn.disabled=false}
};

renderAll(true);
initStore();
</script>

<script type="module">
// Salvataggio nel cloud con Firebase. Finché firebaseConfig è null l'app usa solo il telefono.
// Per collegarlo: vedi LEGGIMI.md, punto «Firebase».
const firebaseConfig = null;

if (firebaseConfig) {
  const V = "11.6.1";
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, signOut, setPersistence, browserLocalPersistence } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`);
  const { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, setDoc, deleteDoc, onSnapshot } = await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  // Cache sul telefono: in palestra senza campo si salva lo stesso, e si sincronizza appena torna la rete
  const db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
  try { await setPersistence(auth, browserLocalPersistence); } catch (e) {}

  const avviso = (err) => {
    const c = (err && err.code) || "";
    const t = c === "auth/unauthorized-domain" ? "Accesso bloccato: aggiungi peps71.github.io ai domini autorizzati di Firebase"
      : c === "auth/operation-not-allowed" ? "Accesso con Google non attivo: abilitalo in Firebase → Authentication"
      : c === "auth/network-request-failed" ? "Accesso non riuscito: sei senza rete?"
      : c === "auth/popup-closed-by-user" || c === "auth/cancelled-popup-request" ? ""
      : "Accesso non riuscito (" + (c || "errore sconosciuto") + ")";
    if (t) toast(t);
  };
  try { await getRedirectResult(auth); } catch (e) { avviso(e); }

  window.entraConGoogle = async () => {
    const provider = new GoogleAuthProvider();
    provider.setCustomParameters({ prompt: "select_account" });
    try { await signInWithPopup(auth, provider); }
    catch (err) {
      if (["auth/popup-blocked", "auth/operation-not-supported-in-this-environment", "auth/internal-error"].includes(err && err.code)) {
        try { await signInWithRedirect(auth, provider); } catch (e2) { avviso(e2); }
      } else avviso(err);
    }
  };
  window.esciDalCloud = async () => {
    try { await signOut(auth); toast("Uscito dal cloud. I dati restano su questo telefono."); } catch (e) {}
  };

  window.cloudPronto = true;
  renderAll(false);
  let appenaEntrato = false;
  const entra = window.entraConGoogle;
  window.entraConGoogle = () => { appenaEntrato = true; return entra(); };
  onAuthStateChanged(auth, (user) => {
    if (!user) { window.detachCloud(); return; }
    const ref = collection(db, "users", user.uid, "diario");
    const col = {
      doc: (id) => ({ set: (v) => setDoc(doc(ref, id), v), delete: () => deleteDoc(doc(ref, id)) }),
      onSnapshot: (cb, errCb) => onSnapshot(ref, cb, errCb)
    };
    window.attachCloud(col, user);
    if (appenaEntrato) toast("Cloud attivo per " + (user.email || "il tuo account"));
  });
}
</script>

if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
